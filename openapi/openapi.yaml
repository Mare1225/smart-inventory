openapi: 3.0.3
info:
  title: Smart Inventory API
  version: 1.1.0
  description: |
    Contrato v1 (el contrato precede a la implementacion; ver OpenApiContractTest y ApiConformanceTest).
    Eventos asincronos: contracts/asyncapi.yaml.

    **Errores:** application/problem+json con code, detail, requestId y errors[] (campo/mensaje). El `code` es estable
    y es lo que el integrador debe usar para decidir: 4xx => corregir la peticion (no reintentar igual);
    429/503 => reintentar tras Retry-After con backoff exponencial y jitter.

    **Rate limit:** clave de conteo = cliente autenticado (no IP). Estrategia por defecto token bucket: rafaga de 20 y
    10 req/s sostenidas por cliente (alternativa configurable: ventana fija de 20 req/s, ver ADR-0003). Cabeceras
    X-RateLimit-Limit y X-RateLimit-Remaining en cada respuesta; 429 incluye Retry-After en segundos. Las peticiones
    sin credenciales se rechazan con 401 antes de consumir cuota.

    **Correlacion:** X-Request-Id (opcional, 8-64 caracteres [A-Za-z0-9._-]) se devuelve en la respuesta y viaja como
    correlationId en los eventos. Si falta o no es seguro, el servidor genera un UUID.

    **Versionado:** cambios aditivos suben la version menor del documento (1.0.0 -> 1.1.0). Cambios incompatibles =>
    /api/v2 con periodo de convivencia y migracion; nunca se modifica v1 en silencio.
    1.1.0 (compatible): 405/415 documentados, code MISSING_HEADER, X-Request-Id, detalle del rate limit.
servers:
  - url: http://localhost:8080
    description: docker compose local
  - url: https://{stagingHost}
    description: Staging (la URL real se guarda en el secreto STAGING_URL del entorno de GitHub)
    variables:
      stagingHost: { default: smart-inventory-staging.onrender.com }
security:
  - ApiKey: []
paths:
  /api/v1/inventory:
    get:
      operationId: listInventory
      summary: Stock por SKU, ubicacion y lote (US-01)
      description: Distingue fisico, reservado y disponible. Sin resultados => 200 con items vacio.
      x-required-scope: inventory:read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - { name: sku, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: location, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: lot, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, schema: { type: string, enum: [sku, location, lotCode, expiresOn, available], default: expiresOn } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: Pagina de stock (puede estar vacia)
          headers:
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockPage' }
              example:
                items: [{ sku: SKU-1001, location: BOD-UIO, lotCode: L-B, expiresOn: '2026-12-01', physical: 30, reserved: 0, available: 30 }]
                page: 0
                size: 20
                totalItems: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/reservations:
    post:
      operationId: createReservation
      summary: Reserva FEFO atomica e idempotente (US-02)
      description: |
        Asigna lotes por vencimiento (nunca vencidos) sin sobreasignar. Repetir la misma Idempotency-Key con el
        mismo cuerpo devuelve la reserva original (200, Idempotent-Replay: true). La misma clave con otro cuerpo => 422.
      x-required-scope: inventory:reserve
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequest' }
            example: { sku: SKU-1001, location: BOD-UIO, quantity: 50, destination: PEDIDO-7788 }
      responses:
        '200':
          description: Reintento idempotente; devuelve la reserva original
          headers: { Idempotent-Replay: { schema: { type: string, example: 'true' } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        '201':
          description: Reserva creada
          content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stock insuficiente (code INSUFFICIENT_STOCK). El cliente NO debe reintentar igual.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: Validacion de negocio/cuerpo (VALIDATION_FAILED) o clave de idempotencia reutilizada (IDEMPOTENCY_KEY_REUSED)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/replenishment/suggestions:
    get:
      operationId: listSuggestions
      summary: Sugerencias de reposicion (US-03). No muta stock.
      description: Filtra por estado, SKU y proveedor. Operacion segura (GET) que nunca modifica stock ni sugerencias. Orden por fecha de creacion descendente.
      x-required-scope: replenishment:read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, APPROVED] } }
        - { name: sku, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: supplier, in: query, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Lista de sugerencias
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/replenishment/suggestions/{id}/approve:
    post:
      operationId: approveSuggestion
      summary: Aprobar sugerencia (OPEN -> APPROVED)
      description: Transicion atomica (UPDATE condicional). Solo OPEN puede aprobarse; repetir responde 409 INVALID_TRANSITION. Publica replenishment.suggestion-approved via outbox.
      x-required-scope: replenishment:approve
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sugerencia aprobada
          content: { application/json: { schema: { $ref: '#/components/schemas/Suggestion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Transicion invalida (INVALID_TRANSITION): la sugerencia ya no esta OPEN'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/dashboard/inventory:
    get:
      operationId: dashboardInventory
      summary: Vista del dashboard con antiguedad del dato (US-04)
      description: Proyeccion mantenida por DashboardConsumer. lastUpdatedAt indica cuando se proceso el ultimo evento, processingDelayMs el retraso evento->proyeccion y stale=true si no se actualiza hace mas de 60 s.
      x-required-scope: inventory:read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Filas con lastUpdatedAt, processingDelayMs y stale
          content: { application/json: { schema: { $ref: '#/components/schemas/DashboardView' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Clave por cliente con scopes: ops-console (inventory:read, replenishment:read, replenishment:approve),
        fulfillment (inventory:read, inventory:reserve), purchasing (replenishment:read, replenishment:approve).
        En staging las claves vienen del gestor de secretos; nunca se versionan.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identificador de correlacion propuesto por el cliente; se devuelve en la respuesta.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,64}$' }
  responses:
    BadRequest:
      description: Parametro o cabecera invalidos / cuerpo ilegible (INVALID_PARAMETER, MISSING_HEADER, MALFORMED_REQUEST). Corregir y reenviar.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Falta X-Api-Key o es invalida (UNAUTHENTICATED)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Cliente autenticado sin el scope requerido (FORBIDDEN)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Recurso inexistente (NOT_FOUND)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMediaType:
      description: Content-Type distinto de application/json (UNSUPPORTED_MEDIA_TYPE)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Limite de tasa excedido (RATE_LIMITED). Esperar Retry-After segundos.
      headers:
        Retry-After: { schema: { type: integer }, description: Segundos hasta que el cliente vuelve a tener cuota }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://smartinventory.usfq.edu.ec/problems/rate-limited', title: Too Many Requests, status: 429, code: RATE_LIMITED, detail: 'Too many requests; retry after 1s', requestId: 86342576-460e-4d00-a8f3-11190ad07b0e }
    Unavailable:
      description: Dependencia caida (DEPENDENCY_UNAVAILABLE). Reintentar con backoff exponencial y jitter.
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          example: INSUFFICIENT_STOCK
          description: |
            UNAUTHENTICATED, FORBIDDEN, INVALID_PARAMETER, MISSING_HEADER, MALFORMED_REQUEST, VALIDATION_FAILED,
            IDEMPOTENCY_KEY_REUSED, NOT_FOUND, INSUFFICIENT_STOCK, INVALID_TRANSITION, METHOD_NOT_ALLOWED,
            UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    StockItem:
      type: object
      required: [sku, location, lotCode, expiresOn, physical, reserved, available]
      properties:
        sku: { type: string }
        location: { type: string }
        lotCode: { type: string }
        expiresOn: { type: string, format: date }
        physical: { type: integer }
        reserved: { type: integer }
        available: { type: integer, description: physical - reserved }
    StockPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    ReservationRequest:
      type: object
      required: [sku, location, quantity, destination]
      properties:
        sku: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        location: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        destination: { type: string, maxLength: 64 }
    Reservation:
      type: object
      required: [reservationId, sku, location, quantity, destination, status, lines, replay]
      properties:
        reservationId: { type: string, format: uuid }
        sku: { type: string }
        location: { type: string }
        quantity: { type: integer }
        destination: { type: string }
        status: { type: string, enum: [CONFIRMED] }
        replay: { type: boolean }
        lines:
          type: array
          description: Resultado FEFO, en orden de consumo
          items:
            type: object
            required: [lotCode, expiresOn, quantity]
            properties:
              lotCode: { type: string }
              expiresOn: { type: string, format: date }
              quantity: { type: integer }
    Suggestion:
      type: object
      required: [id, sku, supplier, suggestedQty, status]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        supplier: { type: string }
        suggestedQty: { type: integer }
        status: { type: string, enum: [OPEN, APPROVED] }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
    DashboardView:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              availableNow: { type: integer }
              reservationsCount: { type: integer }
              lastReservationId: { type: string, format: uuid }
              lastStatus: { type: string }
              lastEventAt: { type: string, format: date-time }
              lastUpdatedAt: { type: string, format: date-time }
              processingDelayMs: { type: integer, format: int64 }
              stale: { type: boolean }
