groups:
  - name: smart-inventory
    rules:
      - alert: AppDown
        expr: up{job="smart-inventory"} == 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "La API no responde al scrape de Prometheus", runbook: "docs/runbook.md#2-diagnostico" }
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Error 5xx > 5%", runbook: "docs/runbook.md" }
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri=~"/api/.*"}[5m])) by (le)) > 0.4
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "p95 de la API > 400 ms (objetivo: consulta 200 ms, reserva 400 ms)" }
      - alert: RateLimitRejectionsHigh
        expr: sum by (client) (rate(smartinventory_ratelimit_rejected_total[5m])) > 1
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Cliente {{ $labels.client }} recibe > 1 rechazo 429/s: abuso o limite mal dimensionado (posible falso bloqueo)" }
      - alert: OutboxBacklog
        expr: smartinventory_outbox_pending > 100
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Outbox sin publicar: broker caido o publicador detenido", runbook: "docs/runbook.md" }
      - alert: EventLagHigh
        expr: histogram_quantile(0.95, sum by (le, consumer) (rate(smartinventory_event_lag_seconds_bucket[5m]))) > 5
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "p95 de atraso evento->consumidor {{ $labels.consumer }} > 5 s: el dashboard se ve desactualizado" }
      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages{queue="inventory.dlq"} > 0
        for: 1m
        labels: { severity: page }
        annotations: { summary: "Mensajes en DLQ: inspeccionar antes de re-procesar", runbook: "docs/runbook.md#4-recuperacion" }
      - alert: ConsumerQueueAging
        expr: rabbitmq_detailed_queue_messages_ready{queue=~"dashboard.q|replenishment.q"} > 500
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "Cola {{ $labels.queue }} acumulada: el consumidor no da abasto" }
      - alert: ConsumerMissing
        expr: rabbitmq_detailed_queue_consumers{queue=~"dashboard.q|replenishment.q"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "La cola {{ $labels.queue }} no tiene consumidores (consumidor pausado o caido)" }
