global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: smart-inventory
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["app:8080"] }]
  # /metrics de rabbitmq_prometheus solo expone agregados (sin etiqueta queue). Las alertas por cola
  # (DLQ, envejecimiento de dashboard.q / replenishment.q) necesitan el endpoint detallado (DEF-04).
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs: [{ targets: ["rabbitmq:15692"] }]
