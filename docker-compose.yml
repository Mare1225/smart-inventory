services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management    # incluye rabbitmq_prometheus (:15692)
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:-inventory}
      RABBIT_HOST: rabbitmq
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-token-bucket}
      # Solo para la prueba de carga (perf/README.md) se elevan; por defecto = application.yml
      APP_RATELIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-20}
      APP_RATELIMIT_REFILLPERSECOND: ${RATE_LIMIT_REFILL:-10}
      APP_RATELIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-20}
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  jaeger:                               # trazas OTLP: API -> JDBC -> outbox -> RabbitMQ -> consumidores
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"       # solo laboratorio local: panel visible sin login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smart-inventory.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
